<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Samgong 30 Online</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --table-green: #064e3b;
            --gold: #f59e0b;
            --text-light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
        }
        .stat-box span {
            display: block;
            font-size: 11px;
            color: #94a3b8;
        }
        .stat-box strong {
            font-size: 14px;
            color: var(--gold);
        }
        .control-panel {
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        input, select, button {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 13px;
        }
        button {
            background: var(--gold);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:active {
            opacity: 0.8;
        }
        .game-table {
            background: var(--table-green);
            border-radius: 12px;
            padding: 15px;
            min-height: 250px;
            text-align: center;
            border: 4px solid #047857;
            position: relative;
        }
        .seats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .seat {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed #10b981;
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 12px;
        }
        .btn-action {
            width: 100%;
            padding: 10px;
            background: #10b981;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel Lobby / Masuk Room -->
        <div id="lobbySection" class="control-panel">
            <h3 style="margin: 0 0 10px 0; color: var(--gold); text-align: center;">Samgong 30 Online Lobby</h3>
            <div class="control-row">
                <label>Nama Pemain:</label>
                <input type="text" id="playerName" placeholder="Nama Anda" value="Player1">
            </div>
            <div class="control-row">
                <label>ID Room:</label>
                <input type="text" id="roomID" placeholder="Misal: room01" value="room01">
            </div>
            <button onclick="gabungRoom()" style="width: 100%; padding: 10px; background: #10b981; color: white;">Masuk / Buat Room</button>
        </div>

        <!-- Panel Game Utama (Ditampilkan setelah masuk room) -->
        <div id="gameSection" style="display:none;">
            <div class="header-stats">
                <div class="stat-box">
                    <span>Saldo Anda</span>
                    <strong id="saldoDisplay">Rp 50.000</strong>
                </div>
                <div class="stat-box">
                    <span>Pot</span>
                    <strong id="potDisplay">Rp 0</strong>
                </div>
                <div class="stat-box">
                    <span>Ronde</span>
                    <strong id="roundDisplay">0</strong>
                </div>
            </div>

            <div class="control-panel">
                <div class="control-row">
                    <span>Room: <strong id="currentRoomText" style="color: #10b981;">-</strong></span>
                    <button onclick="mulaiGame()">Mulai Ronde</button>
                </div>
                <div class="control-row">
                    <label>Ante:</label>
                    <select id="anteSelect">
                        <option value="3000">Rp 3.000</option>
                        <option value="5000">Rp 5.000</option>
                        <option value="10000">Rp 10.000</option>
                    </select>
                </div>
            </div>

            <div class="game-table">
                <p id="statusRoomText" style="margin: 0; font-size: 13px; color: #a7f3d0;">Menunggu pemain lain...</p>
                
                <div class="seats-grid">
                    <div class="seat">
                        <strong>Bangku 1</strong>
                        <p id="player1Slot">Kosong</p>
                    </div>
                    <div class="seat">
                        <strong>Bangku 2</strong>
                        <p id="player2Slot">Kosong</p>
                    </div>
                </div>

                <button class="btn-action" onclick="tarikKartu()" id="btnAction" style="display:none;">Ambil Kartu (Hit)</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            databaseURL: "https://penjurian-perkutut-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let currentRoom = "";
        let playerSaldo = 50000;

        window.gabungRoom = function() {
            myName = document.getElementById('playerName').value.trim();
            currentRoom = document.getElementById('roomID').value.trim();

            if (!myName || !currentRoom) {
                alert("Mohon isi nama dan ID Room!");
                return;
            }

            document.getElementById('lobbySection').style.display = 'none';
            document.getElementById('gameSection').style.display = 'block';
            document.getElementById('currentRoomText').innerText = currentRoom;

            // Referensi Room di Database
            const roomRef = ref(db, 'samgong_rooms/' + currentRoom);

            // Set data pemain ke database real-time
            update(roomRef, {
                status: "Menunggu",
                pot: 0,
                ronde: 0,
                [myName]: { saldo: playerSaldo, status: "Duduk" }
            });

            // Dengarkan perubahan data secara real-time dari Firebase
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('potDisplay').innerText = "Rp " + (data.pot || 0).toLocaleString('id-ID');
                    document.getElementById('roundDisplay').innerText = data.ronde || 0;
                    
                    let players = Object.keys(data).filter(k => k !== 'status' && k !== 'pot' && k !== 'ronde');
                    document.getElementById('player1Slot').innerText = players[0] ? `${players[0]} (Aktif)` : 'Kosong';
                    document.getElementById('player2Slot').innerText = players[1] ? `${players[1]} (Aktif)` : 'Kosong';
                }
            });
        };

        window.mulaiGame = function() {
            if (!currentRoom) return;
            let ante = parseInt(document.getElementById('anteSelect').value);
            const roomRef = ref(db, 'samgong_rooms/' + currentRoom);
            
            update(roomRef, {
                status: "Permainan Dimulai",
                ronde: Math.floor(Math.random() * 10) + 1,
                pot: ante * 2
            });
            document.getElementById('btnAction').style.display = 'block';
            document.getElementById('statusRoomText').innerText = "Giliran Anda bermain!";
        };

        window.tarikKartu = function() {
            alert("Aksi ambil kartu dikirim ke room!");
            document.getElementById('btnAction').style.display = 'none';
        };
    </script>
</body>
</html>
